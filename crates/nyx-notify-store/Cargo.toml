[package]
name = "nyx-notify-store"
version = "0.1.0"
description = "Nyx notification history: SQLite store, Omarchy import, retention, pins"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
nyx-config = { git = "https://github.com/nyxos-project/nyx-system.git", rev = "2c051e628af5582516ece1a8790882328194c26b" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
regex = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
