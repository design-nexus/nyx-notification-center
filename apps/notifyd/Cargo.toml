[package]
name = "nyx-notifyd"
version = "0.1.0"
description = "Nyx notification service: keeps every notification in Nyx's history"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
inotify = "0.11"
libc = "0.2"
png = "0.18"
nyx-notify-store = { path = "../../crates/nyx-notify-store" }
# Which paired device a relayed phone notification came from (Nyx Connect).
nyx-connect = { git = "https://github.com/design-nexus/nyx-core.git", rev = "166ff17bdb09dd6c5f130fd28ecf81d1f8a59d2d" }
serde = "1"
serde_json = "1"
zbus = "5"

[dev-dependencies]
serde = "1"
