[package]
name = "nyx-notification-center-backend"
version = "0.1.0"
description = "Nyx Notification Center without GTK: the panel's state, pop-ups and Panel1, for its Quickshell interface"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-notification-center-backend"
path = "src/main.rs"

[dependencies]
async-channel = "2"
gio = "0.22"
gio-unix = "0.22"
glib = "0.22"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4f05fb8fc92ec211f4e0f0b722fdf29a083c9e89" }
nyx-notify-store = { path = "../../crates/nyx-notify-store" }
nyx-theme-core = { git = "https://github.com/design-nexus/nyx-design.git", rev = "cf393978364ca7b2a309a88a8d1651bf9d338916" }
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4f05fb8fc92ec211f4e0f0b722fdf29a083c9e89" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
