[package]
name = "nyx-notification-center-backend"
version = "0.1.0"
description = "Nyx Notification Center without GTK: the panel's state, pop-ups and Panel1, for its Quickshell interface"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-notification-center-backend"
path = "src/main.rs"

[dependencies]
async-channel = "2"
gio = "0.22"
gio-unix = "0.22"
glib = "0.22"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411" }
nyx-notify-store = { path = "../../crates/nyx-notify-store" }
nyx-theme-core = { git = "https://github.com/design-nexus/nyx-design.git", rev = "914b14ec5574ca04cbb985b571cfbfb0a42aae15" }
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "a258c315f056ac649586fdb55e98613056221411" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
