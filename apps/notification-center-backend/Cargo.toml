[package]
name = "nyx-notification-center-backend"
version = "0.1.0"
description = "Nyx Notification Center without GTK: the panel's state, pop-ups and Panel1, for its Quickshell interface"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "nyx-notification-center-backend"
path = "src/main.rs"

[dependencies]
async-channel = "2"
gio = "0.22"
gio-unix = "0.22"
glib = "0.22"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "94e0c8aa133074c74adb31365e51f56168114f68" }
nyx-notify-store = { path = "../../crates/nyx-notify-store" }
nyx-theme-core = { git = "https://github.com/design-nexus/nyx-design.git", rev = "ea8839d237a23ec83887429475f0780c06a36826" }
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "94e0c8aa133074c74adb31365e51f56168114f68" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
