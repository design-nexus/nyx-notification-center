[package]
name = "nyx-notification-center"
version = "0.1.0"
description = "Nyx Notification Center: notification inbox, pins and history for Omarchy"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gio-unix = "0.22"
gtk4-layer-shell = "0.8"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "166ff17bdb09dd6c5f130fd28ecf81d1f8a59d2d" }
nyx-ui-link = { git = "https://github.com/design-nexus/nyx-core.git", rev = "166ff17bdb09dd6c5f130fd28ecf81d1f8a59d2d" }
nyx-notify-store = { path = "../../crates/nyx-notify-store" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "553f65567057150af4929033896531879528bbf4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
