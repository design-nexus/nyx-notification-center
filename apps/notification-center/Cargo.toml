[package]
name = "nyx-notification-center"
version = "0.1.0"
description = "Nyx Notification Center: notification inbox, pins and history for Omarchy"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
gio-unix = "0.22"
gtk4-layer-shell = "0.8"
nyx-desktop = { git = "https://github.com/design-nexus/nyx-core.git", rev = "44d4d4c8009259b4ea7d7d0f564319ea9a1ce684" }
nyx-notify-store = { path = "../../crates/nyx-notify-store" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "976fed940841a2a505ffe644f632cb60e12988a8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
